<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Planner</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf6f1">
<script>
/* apply the saved (or system) theme before first paint to avoid a flash */
(function () {
  var t = null;
  try { t = localStorage.getItem('budgetPlanner.theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%238b7cf6'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<div class="app">
  <!-- Sidebar (desktop) -->
  <aside class="side">
    <a class="brand" href="#dashboard"><span class="logo">₹</span><span>Budget<br>Planner</span></a>
    <nav class="menu" id="menu">
      <a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Dashboard</a>
      <a href="#transactions" data-view="transactions"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Transactions</a>
      <a href="#budget" data-view="budget"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1"/></svg>Budget</a>
      <a href="#goals" data-view="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</a>
      <a href="#reports" data-view="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
    </nav>
    <div class="side-note">Your data stays<br>in this browser.</div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="top">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="themeBtn" data-action="toggle-theme" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <label class="month-pick" title="Planning month">
          <span>Month</span>
          <input type="month" id="monthPicker">
        </label>
        <button class="btn" data-action="new-tx">+ Add transaction</button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<!-- Tab bar (mobile) -->
<nav class="tabbar" id="tabbar">
  <a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#transactions" data-view="transactions"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Activity</a>
  <a href="#budget" data-view="budget"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1"/></svg>Budget</a>
  <a href="#goals" data-view="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</a>
  <a href="#reports" data-view="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
</nav>

<!-- Add / edit transaction -->
<dialog id="txDialog">
  <form id="txForm" novalidate>
    <h2 id="dialogTitle">Add transaction</h2>
    <p class="sub">Record your income or expenses.</p>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="expense" class="on">Expense</button>
      <button type="button" data-type="income">Income</button>
    </div>
    <label class="f" for="desc">Description</label>
    <input type="text" id="desc" placeholder="e.g. Grocery shopping" maxlength="80" autocomplete="off">
    <div class="row2">
      <div><label class="f" for="amount">Amount (₹)</label><input type="number" id="amount" placeholder="500" min="0" step="0.01"></div>
      <div><label class="f" for="date">Date</label><input type="date" id="date"></div>
    </div>
    <label class="f" for="category">Category</label>
    <select id="category"></select>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn" id="submitBtn">Add transaction</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts"></div>
</body>
</html>
